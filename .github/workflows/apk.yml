# Baut die APK "Fire-Einstellungen". Start: Push auf main oder Actions -> "APK" -> Run workflow.
# Signiert mit denselben Repository-Secrets wie Plezy+ (ANDROID_KEYSTORE_BASE64,
# ANDROID_STORE_PASSWORD, ANDROID_KEY_PASSWORD, ANDROID_KEY_ALIAS).
name: APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Signierschluessel pruefen
        if: env.KEYSTORE == ''
        run: |
          echo "::error::Secret ANDROID_KEYSTORE_BASE64 fehlt."
          exit 1

      - name: APK bauen
        env:
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          echo "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/release.jks"
          export KEYSTORE_FILE="$RUNNER_TEMP/release.jks"
          gradle --no-daemon assembleRelease
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/fire-einstellungen.apk

      - uses: actions/upload-artifact@v4
        with:
          name: fire-einstellungen-apk
          path: out/fire-einstellungen.apk
